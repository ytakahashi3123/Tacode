
computational_setup:
  # Flag for initial or restart calculation
  # --True: initial condition, False: restart
  flag_initial: True

  # Maximum time step, s
  # --The run ends when the vehicle reaches altitude 0 (the 3396 km sphere) long before this
  time_elapsed_maximum: 2000.0

  # Sanity check on the state (a diverged run stops instead of being written out):
  # a finite state, the geocentric distance within factor_radius_maximum times its
  # initial value, and the velocity within factor_velocity_maximum times the escape
  # velocity at the initial position
  flag_check_divergence: True
  factor_radius_maximum: 10.0
  factor_velocity_maximum: 10.0


satellite: 
  # A 70-degree sphere-cone entry capsule of the Viking / Pathfinder class:
  # 2.65 m base diameter, nose radius half the base radius, 585 kg. This is a sample
  # vehicle, not a reconstruction of any flight, and it flies without a parachute.
  # Mass, kg
  mass: 585.0
  # Characteristic area, m^2 (the base, pi*1.325^2)
  characteristic_area: 5.51546
  # Characteristic length, m (the base radius, which the Kn axis of the table was built with)
  characteristic_length: 1.325

  # Aerodynamic model
  # --constant, or fileread
  kind_aerodynamic_model: fileread

  # Drag coefficient (aerodynamic_model: constant)
  drag_coefficient: 1.0

  # Drag coefficient (aerodynamic model: fileinput)
  # --manual: directory_aerodynamic below, relative to the current directory
  # --default (or auto): <repo>/database/aerodynamic, resolved from the location
  #   of the source file, independent of the current directory
  directory_path_specify: manual # default or manual
  directory_aerodynamic: database/aerodynamic
  filename_aerodynamic: aerodynamic_mars_spherecone70.txt

initial_settings:
  # Initial conditions 
  # Initial coordinate, 1:Long.(deg) 2: Lat.(deg), 3:Alt.(km)
  # --With ellipticity 0 below, the latitude is planetocentric (the Mars convention)
  #   and the altitude is above the 3396 km sphere, the datum of the atmosphere table
  coordinate:
    - -48.7
    - 19.13
    - 125.0
  # Initial velocity relative to the rotating planet, [East, North, Up], m/s
  # --6000 m/s at a flight-path angle of -12 degrees
  velocity:
    - 5868.9
    - 0
    - -1247.5
  density_factor:
    - 1.0


planet:
  # Mars. The gravity field is JGMRO_120F (Konopliv et al., MRO radio science, PDS
  # mro-m-rss-5-sdp-v1), whose reference radius is 3396.0 km and whose coefficients
  # are fully normalised; they are converted below to the terms of README.md.
  # Gravitational constant, M.m2/kg2
  gravitational_constant: 6.67408e-11
  # Planet mass (Mars), kg
  # --GM of Mars alone, 42828.3748574 km3/s2, divided by the constant above
  mass: 6.4171204e+23
  # Planet radius on Equator, m
  # --The reference radius of the gravity field and the datum of the atmosphere table
  radius: 3.3960000e+6
  # Ellipticity
  # --0: a sphere. The altitude is then r - 3396 km, which is the height the Mars
  #   Climate Database table is given in, and the latitude is planetocentric.
  #   The IAU ellipsoid (flattening 1/170) would put the table up to 20 km off at the poles.
  ellipticity: 0.0
  # Rotation rate, rad/s
  # --IAU WGCCRE 2015: 350.89198226 deg/day
  rotation_rate: 7.0882181e-5
  # Dynamic form factor (J2) for potential calculation
  # --J_n = -C_n0 sqrt(2n+1) from the normalised C_20, C_30, C_40.
  # --J22 = -sqrt(C22^2 + S22^2) and Lambda22 = atan2(S22, C22)/2 (the longitude of the
  #   long axis of the equator), so that -J22 cos 2(lon - Lambda22) = C22 cos 2lon + S22 sin 2lon,
  #   with the unnormalised C22, S22 = sqrt(5/12) times the normalised -8.4633e-5, 4.8940e-5
  potential_factor:
    J2: 1.9566086e-3
    J22: -6.3106447e-5
    J3: 3.1476119e-5
    J4: -1.5387645e-5
    Lambda22: 74.980468   # Degree
    

epoch:
  # Absolute time of the initial condition (UTC)
  # --The solver itself needs only the elapsed time; the epoch is required by the
  #   models that depend on the date: the wind (the NCEP time axis, the day of year
  #   and the universal time HWM14 takes) and, later, the lunar and solar ephemeris.
  # --False (default): no absolute time. The outputs are then exactly as before.
  flag_epoch: False

  # UTC in ISO 8601. Quote it so that it stays a string; an unquoted timestamp is
  # accepted as well. A missing time zone is taken as UTC.
  # --Leap seconds are not modelled; UTC is treated as a uniform time scale.
  datetime: '2026-03-21T03:00:00Z'


atmosphere:
  # Atmosphere model
  # --constant, or fileread
  kind_atmosphere_model: fileread

  # Atmosphere model: constant settings
  # Densitry, kg/m3
  density: 1.e-3
  # Temperature, K
  temperature: 300.0

  # Atmosphere model: file input
  # --Path resolution is the same as satellite.directory_path_specify
  directory_path_specify: manual # default or manual
  directory_atmosphere: database/atmosphere
  filename_atmosphere: atmospheremodel_mars.txt

  
wind:
  # Wind
  # --The aerodynamics is evaluated with the air-relative velocity
  #     v_air = v_ecef - v_wind
  #   which affects the drag, the 6-DOF force and moment, the dynamic pressure and
  #   the angle of attack. Gravity, the Coriolis and the centrifugal terms keep using
  #   the ECEF velocity, and the angular velocity is untouched: the wind translates
  #   the air, it does not rotate it.
  # --False (default): the atmosphere co-rotates with the planet, exactly as before.
  flag_wind: False

  # Wind model
  # --constant: one uniform wind everywhere
  # --fileread: interpolate a table of longitude x latitude x altitude
  kind_wind_model: constant

  # Wind model: constant settings
  # --[East, North, Up] in the local geocentric horizon, m/s. This is the frame the
  #   initial velocity already uses, so the two are given the same way. It is
  #   geocentric, not geodetic; see the note in README.md.
  velocity:
    - 0.0
    - 0.0
    - 0.0

  # Wind model: file input
  # --Path resolution is the same as satellite.directory_path_specify
  directory_path_specify: manual # default or manual
  directory_wind: database/wind
  filename_wind: windmodel.txt

  # Treatment outside the altitude range of the table
  # --zero (default): no wind there, that is, the atmosphere co-rotates with the planet
  #   as it does without this section. NCEP reaches only 31-48 km, so clamping its top
  #   value upwards would stretch the stratospheric jet into the thermosphere.
  # --clamp: use the value at the end of the table.
  # The horizontal directions are always clamped to the edge of the region.
  kind_extrapolation: zero

  # Scale factor applied to the wind, whatever the model (1.0 = the wind as given)
  # --Written as a one-element list because the Monte-Carlo routine perturbs it
  #   element by element. This is how a wind TABLE is scattered: the driver
  #   rewrites numbers in the control file, and a table is chosen by its file name.
  # --1.0 leaves the result bit for bit as it is without this key.
  velocity_factor:
    - 1.0


time_integration:
  # Time integration settings

  # Time marching scheme:
  # --"runge_kutta": 4-stage 4th-order Runge-Kutta (recommended)
  # --"explicit_euler": 1st-order explicit Euler
  kind_time_scheme: runge_kutta
  #kind_time_scheme: explicit_euler

  # Constant timestep (s)
  # --The landing point moves 0.47 m from 1.0 s to 0.5 s and 3 cm from 0.5 s to 0.025 s
  timestep_constant: 0.5


restart_process:

  # Output directory
  directory_output: output_restart

  # Time series
  # --True: stored individually as time series, False: stored by overwriting
  flag_time_series: False

  # Digid for step
  # --for example, restart_0012.dat will be stored if using digid_step: 4
  digid_step: 4

  # Restart step for reading
  restart_step: 500

  # Restart file name (output)
  file_restart: restart.dat

  # Output frequency
  frequency_output: 1


post_process:
  # Output directory
  directory_output: output_result

  # Output (GPX)
  # NOTE: the GPX writer is currently not called from output_routine
  #       (the call is commented out in output_gpsdata.py). Enabling it
  #       requires the optional gpxpy package.
  flag_output_gpx: True
  filename_output_gpx: geodetic.gpx

  # Output (KML)
  # --Off: Google Earth would draw the Martian coordinates on the Earth
  kml:
    flag_output: False
    # File name
    filename_output: geodetic.kml
    # --kml parameters
    linestyle_color: simplekml.Color.white
    linestyle_width: 4
    extrude: 1
    # --Output frequency
    frequency_output: 10

  # Output (Tecplot)  
  tecplot:
    flag_output: True
    # File name
    filename_output: tecplot.dat
    # --Output frequency
    frequency_output: 1

