
# =============================================================================
#  Tacode: reference control file
# =============================================================================
#  This file is the reference (template) for a Tacode run. It lists every key
#  the code actually reads, with its unit, accepted values and remarks.
#  The values below are those of the tutorial case, so a plain copy of this
#  file reproduces tutorial/work.
#
#  How it is read
#    - The control file is read from the CURRENT directory and all output is
#      written to the CURRENT directory. Copy this file into a case directory
#      and run there:
#          cp src/config.yml <case>/config.yml
#          cd <case> && python3 <repo>/src/tacode.py
#    - Another file name can be given with -file:
#          python3 ../../src/tacode.py -file my_config.yml
#    - The montecarlo: section at the bottom is read only by
#      tacode-montecarlo.py. tacode.py ignores it.
#
#  Keys that are commented out below are not read by the current version;
#  they are kept as documentation of the intended (unimplemented) feature.
# =============================================================================


computational_setup:
  # Flag for initial or restart calculation
  # --True: initial condition, False: restart
  # NOTE: the restart branch (False) is not implemented; the code stops there.
  flag_initial: True

  # Maximum time step, s
  # Integration runs while (elapsed time) < this value, i.e. the number of
  # steps is time_elapsed_maximum / timestep_constant.
  time_elapsed_maximum: 5000.0


satellite: 
  # Mass, kg
  mass: 3.971
  # Characteristic area, m^2
  # --Reference area of the drag force
  characteristic_area: 0.552
  # Characteristic length, m
  # --Reference length of the Knudsen number (Kn = mean free path / this)
  characteristic_length: 0.8

  # Aerodynamic model
  # --constant, or fileread
  # --constant: drag_coefficient below is used at every step
  # --fileread: Cd is interpolated from the database file against Kn
  kind_aerodynamic_model: fileread

  # Drag coefficient (aerodynamic_model: constant)
  drag_coefficient: 1.0

  # Drag coefficient (aerodynamic model: fileinput)
  # --manual: directory_aerodynamic below, relative to the current directory.
  #   The tutorial cases keep their own copy of the tables in <case>/database,
  #   so that a case directory is self-contained
  # --default (or auto): <repo>/database/aerodynamic, resolved from the
  #   location of the source file, independent of the current directory
  directory_path_specify: manual # default or manual
  directory_aerodynamic: database/aerodynamic
  filename_aerodynamic: aerodynamic.txt


initial_settings:
  # Initial position, WGS84 geodetic: 1:Long.(deg) 2: Lat.(deg), 3:Alt.(km)
  coordinate:
    - -156.79
    -  51.47
    -  201.58
  # Initial speed, geocentric local frame [east, north, up], m/s
  # NOTE: the reference frame differs from the one of the position above
  #       (geodetic vs geocentric); "north/up" tilt by up to 0.19 deg.
  velocity:
    -  7577.57998256923
    - -262.224438463479
    -  3.45812245578943
  # Multiplication factor of the atmospheric density (1.0 = table value)
  # --Written as a one-element list because the Monte-Carlo routine
  #   perturbs it element by element.
  density_factor:
    - 1.0


planet:
  # Gravitational constant, M.m2/kg2
  gravitational_constant: 6.67408e-11
  # Planet mass (Earth), kg
  mass: 5.9723662e+24
  # Planet radius on Equator, m
  radius: 6.3781370e+6 
  # Ellipticity 
  ellipticity: 3.35281066474e-3
  # Rotation rate, rad/s
  rotation_rate: 7.292115e-5
  # Dynamic form factor (J2) for potential calculation
  # --See README.md for the definition of the gravitational potential
  potential_factor:
    J2: 1.082629e-3
    J22: -1.81222e-6
    J3: -2.5356e-6 
    J4: -1.62336e-6
    Lambda22: -14.545   # Degree
    

epoch:
  # Absolute time of the initial condition (UTC)
  # --The solver itself needs only the elapsed time; the epoch is required by the
  #   models that depend on the date: the wind (the NCEP time axis, the day of year
  #   and the universal time HWM14 takes) and, later, the lunar and solar ephemeris.
  # --False (default): no absolute time. The outputs are then exactly as before.
  flag_epoch: False

  # UTC in ISO 8601. Quote it so that it stays a string; an unquoted timestamp is
  # accepted as well. A missing time zone is taken as UTC.
  # --Leap seconds are not modelled; UTC is treated as a uniform time scale.
  datetime: '2026-03-21T03:00:00Z'


atmosphere:
  # Atmosphere model
  # --constant, or fileread
  # --constant: the three values below are used at every altitude
  # --fileread: NRLMSISE-00 table, interpolated against altitude
  kind_atmosphere_model: fileread

  # Atmosphere model: constant settings
  # Densitry, kg/m3
  density: 1.e-3
  # Temperature, K
  temperature: 300.0
  # Knudsen number
  knudsen: 1.0

  # Treatment above the top of the atmosphere table
  # --exponential: extrapolate with a scale height fitted to the top of the table
  # --clamp: use the value at the top of the table (the behaviour before v2.1.1)
  kind_extrapolation: exponential

  # Atmosphere model: file input
  # --Path resolution is the same as satellite.directory_path_specify
  # --atmospheremodel.txt       : CCMC format, 0-400 km (default, used by
  #                               the tutorial and the reference output)
  # --atmospheremodel_700km.txt : Fortran format, 0-700 km, low solar activity
  # The two tables are NOT interchangeable; see database/atmosphere/README.md
  directory_path_specify: manual # default or manual
  directory_atmosphere: database/atmosphere
  filename_atmosphere: atmospheremodel.txt

  
wind:
  # Wind
  # --The aerodynamics is evaluated with the air-relative velocity
  #     v_air = v_ecef - v_wind
  #   which affects the drag, the 6-DOF force and moment, the dynamic pressure and
  #   the angle of attack. Gravity, the Coriolis and the centrifugal terms keep using
  #   the ECEF velocity, and the angular velocity is untouched: the wind translates
  #   the air, it does not rotate it.
  # --False (default): the atmosphere co-rotates with the Earth, exactly as before.
  flag_wind: False

  # Wind model
  # --constant: one uniform wind everywhere
  # --fileread: interpolate a table of longitude x latitude x altitude
  kind_wind_model: constant

  # Wind model: constant settings
  # --[East, North, Up] in the local geocentric horizon, m/s. This is the frame the
  #   initial velocity already uses, so the two are given the same way. It is
  #   geocentric, not geodetic; see the note in README.md.
  velocity:
    - 0.0
    - 0.0
    - 0.0

  # Wind model: file input
  # --Path resolution is the same as satellite.directory_path_specify
  directory_path_specify: manual # default or manual
  directory_wind: database/wind
  filename_wind: windmodel.txt

  # Treatment outside the altitude range of the table
  # --zero (default): no wind there, that is, the atmosphere co-rotates with the Earth
  #   as it does without this section. NCEP reaches only 31-48 km, so clamping its top
  #   value upwards would stretch the stratospheric jet into the thermosphere.
  # --clamp: use the value at the end of the table.
  # The horizontal directions are always clamped to the edge of the region.
  kind_extrapolation: zero

  # Scale factor applied to the wind, whatever the model (1.0 = the wind as given)
  # --Written as a one-element list because the Monte-Carlo routine perturbs it
  #   element by element. This is how a wind TABLE is scattered: the driver
  #   rewrites numbers in the control file, and a table is chosen by its file name.
  # --1.0 leaves the result bit for bit as it is without this key.
  velocity_factor:
    - 1.0


time_integration:
  # Time integration settings

  # Time marching scheme: 
  # --"runge_kutta": 4-stage 4th-order Runge-Kutta (recommended)
  # --"explicit_euler": 1st-order explicit Euler
  kind_time_scheme: runge_kutta
  #kind_time_scheme: explicit_euler

  # Constant timestep (s)
  # --Also used to convert the step index into the output time
  timestep_constant: 1.0

  # Temporal accuracy using LUSGS unsteady simulation
  # --2nd_backward_diff or 1st_backward_diff
  # NOTE: not used by the current version (no implicit scheme is implemented).
  #kind_backward_difference: 2nd_backward_diff


restart_process:

  # Output directory
  # --Created automatically if it does not exist
  directory_output: output_restart

  # Time series
  # --True: stored individually as time series, False: stored by overwriting
  flag_time_series: False

  # Digid for step
  # --for example, restart_0012.dat will be stored if using digid_step: 4
  digid_step: 4

  # Restart step for reading
  # NOTE: read only by the restart routine, which is not implemented
  #       (computational_setup.flag_initial: False stops the run).
  restart_step: 500

  # Restart file name (output)
  # --The restart file holds the full trajectory in the ECEF cartesian system
  file_restart: restart.dat

  # Output frequency
  # NOTE: not used by the current version (the restart file is written once,
  #       at the end of the run, with every step included).
  #frequency_output: 1


post_process:
  # Output directory
  # --Created automatically if it does not exist
  directory_output: output_result

  # Output (GPX)
  # NOTE: the GPX writer is currently not called from output_routine
  #       (the call is commented out in output_gpsdata.py). Enabling it
  #       requires the optional gpxpy package.
  flag_output_gpx: True
  filename_output_gpx: geodetic.gpx

  # Output (KML)
  # --Requires simplekml
  kml:
    flag_output: True
    # File name
    filename_output: geodetic.kml
    # --kml parameters
    # --linestyle_color accepts 'simplekml.Color.white', 'white' or 'ffffffff'
    #   (aabbggrr hexadecimal)
    linestyle_color: simplekml.Color.white
    linestyle_width: 4
    extrude: 1
    # --Output frequency, in steps. At least two points must be written,
    #   otherwise the LineString cannot be drawn.
    frequency_output: 10

  # Output (Tecplot)  
  tecplot:
    flag_output: True
    # File name
    filename_output: tecplot.dat
    # --Output frequency, in steps (1 = every step)
    frequency_output: 1



# Monte-Carlo process
# --Read by tacode-montecarlo.py only. The driver copies template_path into
#   work_dir/<case_dir>_template, then makes one case directory per iteration,
#   rewrites the target variables with a random dispersion and runs cmd_shell
#   in parallel.
montecarlo:
  # TAcode case directory
  # --work_dir is REMOVED AND RECREATED at every run
  work_dir: work_montecarlo
  case_dir: case
  
  # Template path for Tacode work directory
  # --default (or auto): <repo>/tutorial_template
  # --manual: template_path below
  template_path_specify: default # default or manual
  template_path: ../../tutorial_template 

  # Number of iteraction in Monte-Carlo routine
  number_iteration: 16

  # Maximum number of execution in parallel
  maximum_number_execution: 8

  # Treatment of a case which does not complete
  # --False (default): if any case exits with a non-zero code, or writes no result
  #   file, the run stops with a non-zero exit code once every case has been waited
  #   for. Without this the statistics were quietly built from the cases that
  #   happened to survive.
  # --True: report how many cases failed and go on with the ones that did complete.
  flag_allow_failure: False

  # Target variables to be changed in the Monte Carlo routine
  # --[variable name, section name, dispersion]; the value is replaced by
  #   value*(1 + (rand-0.5)*dispersion), element by element, so the target
  #   must be a list (coordinate, velocity, density_factor, velocity_factor).
  # --The nominal values are read from THIS file and the matching lines of the
  #   copied control file are rewritten, so keep the two in step.
  # --The scatter is relative: an element whose nominal value is 0.0 stays 0.0.
  # --The rewriting is textual: within the section, it looks for the key and
  #   rewrites the list lines that follow it. The section name is what tells
  #   wind.velocity apart from initial_settings.velocity.
  # --A wind TABLE cannot be scattered this way (it is chosen by its file name);
  #   scatter wind.velocity_factor instead.
  target_variable:
    - 
      - density_factor # Variable name
      - initial_settings # Variable's root name 
      - 0.1          # Dispersion in random
#    - 
#      - velocity # Variable name
#      - initial_settings # Variable's root name 
#      - 0.1          # Dispersion in random

  # Executing script
  # --Run in each case directory; it receives the path of src/ as $1
  cmd_shell: ./run_tacode.sh
  
  # Control file
  # --Name of the control file inside the template, rewritten per case
  filename_control: config.yml
  
  # Result file computed by Tacode, relative to the case directory
  # --This is what the postprocess gathers, so it is the Tecplot output of the run
  #   (post_process.directory_output + post_process.tecplot.filename_output).
  filename_trajectory: output_result/tecplot.dat
  
  # Gathered result of all the cases
  # --Once every case has run, the postprocess writes the Tecplot outputs of the
  #   cases into one file, one zone per case, under result_dir. The variables line
  #   is carried over from the cases themselves, so the columns follow whatever the
  #   run wrote (the wind and the attitude add columns).
  # --Statistics of the impact points are not computed here; that is what
  #   src_helper/montecarlo_dispersion/ does.
  result_dir: result_tacode
  flag_tecplot: True
  filename_tecplot: tecplot_taresult.dat
