# Apollo 4 (AS-501) entry, 1967-11-09
#
# Validation case; see README.md in this directory for the sources of every number
# and for what the comparison does and does not show.
#
#   Flight data : NASA TM X-58091, table I (45-day best estimated trajectory)
#   Aerodynamics: NASA TN D-6725, table I (trim coefficients, M > 29.5)
#   Geometry    : NASA TN D-3890 (maximum diameter 154 in.)
#
# **Three degrees of freedom means drag only.** Apollo 4 flew a lifting entry
# (L/D = 0.30) with roll modulation, so the computed trajectory is expected to
# depart from the flight data; the size of that departure is the result here.

computational_setup:
  # Flag for initial or restart calculation
  # --True: initial condition, False: restart
  flag_initial: True

  # Maximum time step, s
  # --The flight table ends 552 s after entry interface, at 37 km altitude.
  time_elapsed_maximum: 700.0

  # Sanity check on the state (a diverged run stops instead of being written out)
  flag_check_divergence: True
  factor_radius_maximum: 10.0
  factor_velocity_maximum: 10.0


satellite:
  # Mass, kg
  # --Entry mass of the command module: 11 959 lb at the entry interface
  #   (NASA TN D-5399, table II, which also gives the mass loss through the entry:
  #   11 659 lb at drogue deployment, 2.5 % less, which this case does not model).
  mass: 5424.6
  # Characteristic area, m^2
  # --pi/4 x 3.9116^2, the maximum diameter of 154 in. (NASA TN D-3890)
  characteristic_area: 12.0171
  # Characteristic length, m
  characteristic_length: 3.9116

  # Aerodynamic model
  # --constant, or fileread
  kind_aerodynamic_model: constant

  # Drag coefficient (aerodynamic_model: constant)
  # --Trim value at M > 29.5: CD = 1.2891 at alpha = 160.06 deg. (NASA TN D-6725,
  #   table I). The same table gives CL = 0.38773, which a 3-DOF run cannot use.
  drag_coefficient: 1.2891

  # Not used with kind_aerodynamic_model: constant, kept so that the case can be
  # switched over to a table without editing the path settings
  directory_path_specify: manual # default or manual
  directory_aerodynamic: database/aerodynamic
  filename_aerodynamic: aerodynamic.txt

initial_settings:
  # Initial conditions at the first point of table I (29 968 s from lift-off)
  # Initial coordinate, 1:Long.(deg) 2: Lat.(deg), 3:Alt.(km)
  # --The table gives no ground track. The entry point is the reported splashdown
  #   point (30 deg. 06' N, 172 deg. 32' W) walked back 3620 km along the great
  #   circle of 32.6 deg. inclination that passes through it; that is the integral
  #   of the tabulated ground speed plus the descent under the parachutes.
  coordinate:
    - 153.932
    - 18.467
    - 123.4794
  # [East, North, Up] in the local geocentric horizon, m/s
  # --|V| = 10733.84 m/s (table I), flight-path angle -7.129 deg. (a quadratic
  #   through the first three points of the table), azimuth 62.65 deg. (the great
  #   circle above). Table I gives the velocity relative to the atmosphere, which
  #   is what this section sets.
  velocity:
    - 9460.27
    - 4893.27
    - -1332.11
  density_factor:
    - 1.0


planet:
  # Gravitational constant, M.m2/kg2
  gravitational_constant: 6.67408e-11
  # Planet mass (Earth), kg
  mass: 5.9723662e+24
  # Planet radius on Equator, m
  radius: 6.3781370e+6
  # Ellipticity
  ellipticity: 3.35281066474e-3
  # Rotation rate, rad/s
  rotation_rate: 7.292115e-5
  # Dynamic form factor (J2) for potential calculation
  potential_factor:
    J2: 1.082629e-3
    J22: -1.81222e-6
    J3: -2.5356e-6
    J4: -1.62336e-6
    Lambda22: -14.545   # Degree


epoch:
  # Absolute time of the initial condition (UTC)
  # --Lift-off was 1967-11-09 12:00:01 UTC and table I counts seconds from there,
  #   so the first point is at 20:19:29 UTC. Nothing in this case depends on the
  #   epoch (the wind is off); it is here to record when the state vector applies
  #   and to tie the case to the atmosphere table, which was generated for it.
  flag_epoch: True
  datetime: '1967-11-09T20:19:29Z'


atmosphere:
  # Atmosphere model
  # --constant, or fileread
  kind_atmosphere_model: fileread

  # Atmosphere model: constant settings
  # Densitry, kg/m3
  density: 1.e-3
  # Temperature, K
  temperature: 300.0

  # Atmosphere model: file input
  # --NRLMSISE-00 at the entry point and the entry time, generated by
  #   database/atmosphere/generate_atmosphere_table.py. F10.7 = F10.7A = 150,
  #   Ap = 4 (the indices of the day were not available offline).
  directory_path_specify: manual # default or manual
  directory_atmosphere: database/atmosphere
  filename_atmosphere: atmospheremodel_apollo4.txt


wind:
  # No wind: the atmosphere co-rotates with the Earth, as table I assumes when it
  # reports a "relative velocity".
  flag_wind: False
  kind_wind_model: constant
  velocity:
    - 0.0
    - 0.0
    - 0.0
  velocity_factor:
    - 1.0


time_integration:
  # Time marching scheme
  # --"runge_kutta", "explicit_euler"
  kind_time_scheme: runge_kutta

  # Constant timestep, s
  # --The deceleration peaks at about 7 g within a few seconds; 0.05 s resolves it
  #   with room to spare (the step study is in README.md).
  timestep_constant: 0.05


restart_process:
  # Output directory
  directory_output: output_restart

  # Time series
  # --True: stored individually as time series, False: stored by overwriting
  flag_time_series: False

  # Digid for step
  digid_step: 4

  # Restart step for reading
  restart_step: 500

  # Restart file name (output)
  file_restart: restart.dat

  # Output frequency
  frequency_output: 1


post_process:
  # Output directory
  directory_output: output_result

  # Output (KML)
  kml:
    flag_output: True
    filename_output: geodetic.kml
    linestyle_color: simplekml.Color.white
    linestyle_width: 4
    extrude: 1
    frequency_output: 200

  # Output (Tecplot)
  tecplot:
    flag_output: True
    filename_output: tecplot.dat
    # --One line per second of flight
    frequency_output: 20
