# Apollo 4 (AS-501) entry, 1967-11-09 -- lifting entry
#
# The same case as config.yml, with the lift switched on. Run it with
#
#   ./run_tacode.sh -file config_lift.yml
#
# **The direction of the lift is the one measured in flight**: the bank angle below is
# built from the flight-derived vertical lift-to-drag ratio of NASA TN D-5399,
# figure 16(a), not from the bank angle of figure 6(b) (see the comment on
# bank_angle_table, and README.md, for why). Before those figures were found this case
# used a constant bank; the sweep over constant angles is kept in README.md.
#
# Validation case; see README.md in this directory for the sources of every number
# and for what the comparison does and does not show.
#
#   Flight data : NASA TM X-58091, table I (45-day best estimated trajectory)
#   Aerodynamics: NASA TN D-6725, table I (trim coefficients, M > 29.5)
#   Geometry    : NASA TN D-3890 (maximum diameter 154 in.)
#
# **Three degrees of freedom with the lift prescribed.** The magnitude of the lift is a
# constant L/D and its direction comes from the flight; the vehicle is not trimmed here,
# so this run says nothing about the attitude. config.yml is the drag-only case and
# config_6dof.yml solves the attitude instead.

computational_setup:
  # Flag for initial or restart calculation
  # --True: initial condition, False: restart
  flag_initial: True

  # Maximum time step, s
  # --The flight table ends 552 s after entry interface, at 37 km altitude.
  time_elapsed_maximum: 700.0

  # Sanity check on the state (a diverged run stops instead of being written out)
  flag_check_divergence: True
  factor_radius_maximum: 10.0
  factor_velocity_maximum: 10.0


satellite:
  # Mass, kg
  # --Entry mass of the command module: 11 959 lb at the entry interface
  #   (NASA TN D-5399, table II, which also gives the mass loss through the entry:
  #   11 659 lb at drogue deployment, 2.5 % less, which this case does not model).
  mass: 5424.6
  # Characteristic area, m^2
  # --pi/4 x 3.9116^2, the maximum diameter of 154 in. (NASA TN D-3890)
  characteristic_area: 12.0171
  # Characteristic length, m
  characteristic_length: 3.9116

  # Aerodynamic model
  # --constant, or fileread
  kind_aerodynamic_model: constant

  # Drag coefficient (aerodynamic_model: constant)
  # --Trim value at M > 29.5: CD = 1.2891 at alpha = 160.06 deg. (NASA TN D-6725,
  #   table I). The same table gives CL = 0.38773, which a 3-DOF run cannot use.
  drag_coefficient: 1.2891

  # Lift coefficient and bank angle (3-DOF, aerodynamic_model: constant)
  # --CL = 0.368 x CD. **0.368 is the lift-to-drag ratio derived from the Apollo 4
  #   flight itself** (NASA TN D-5399, the average between trim and the first peak g).
  #   The trim table of NASA TN D-6725 gives 0.30076, but that is the Apollo 11
  #   command module, which trimmed at a smaller angle of attack.
  # --The lift is perpendicular to the air-relative velocity. The bank angle is measured
  #   about the velocity vector from the local vertical-up direction, positive towards
  #   the right of the flight direction: 0 deg. is lift up, 180 deg. is lift down.
  # --0.0 (the default, and config.yml) leaves the run drag-only, bit for bit.
  lift_coefficient: 0.47439

  # **The direction of the lift Apollo 4 actually flew.** It is computed from the
  # flight-derived vertical lift-to-drag ratio of NASA TN D-5399 figure 16(a),
  #
  #   bank = arccos( (L/D)v / 0.368 )
  #
  # digitised by digitize_bank.py (see reference/apollo4_liftvertical.dat). The time
  # is seconds from the entry interface.
  # --The bank angle plotted in figure 6(b) of the same report says the same thing
  #   (the two agree to 0.03 in (L/D)v), but it is the control history, and a few
  #   seconds of reading error in its fast reversals moves the vertical lift by a
  #   factor of two right where the trajectory is most sensitive. The vertical lift
  #   is the quantity the trajectory responds to, so it is read directly.
  # --The arccos returns 0 to 180 deg., so this table is **the magnitude of the bank**:
  #   the sign (left or right) is lost. Figure 6(b) keeps it, and it changes several
  #   times -- negative to about 125 s, positive over 130-300 s, negative again over
  #   300-450 s -- so the horizontal lift here points to the right of the flight
  #   direction throughout, which is not what Apollo 4 flew. The vertical lift, which
  #   is what the trajectory responds to, is cos(bank) and does not care. Take the
  #   down-range agreement of this case as the result; the cross-range is not a
  #   comparison. reference/apollo4_bank.dat holds the signed history.
  bank_angle_table:
    - [   0.0,    20.35]
    - [   5.0,    20.35]
    - [  10.0,    20.35]
    - [  15.0,    20.35]
    - [  20.0,    20.35]
