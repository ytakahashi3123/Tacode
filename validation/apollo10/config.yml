# Apollo 10 (AS-505) entry, 1969-05-26
#
# Validation case. **The bank angle is flight data here**, not an assumption: NASA
# TN D-6725 figure 12 plots the roll angle the vehicle actually held, and figure 13
# the altitude and velocity it flew. See README.md for the sources of every number.
#
#   Entry state : NASA TN D-6725, table II (best-estimated trajectory)
#   Bank angle  : NASA TN D-6725, figure 12, digitised (digitize_figure.py)
#   Flight data : NASA TN D-6725, figure 13, digitised
#   Aerodynamics: NASA TN D-6725, table I (trim coefficients, M > 29.5)
#   Geometry    : NASA TN D-3890 (maximum diameter 154 in.)

computational_setup:
  # Flag for initial or restart calculation
  # --True: initial condition, False: restart
  flag_initial: True

  # Maximum time step, s
  # --The digitised flight data ends 414 s after the entry interface, at 28 km.
  time_elapsed_maximum: 450.0

  # Sanity check on the state (a diverged run stops instead of being written out)
  flag_check_divergence: True
  factor_radius_maximum: 10.0
  factor_velocity_maximum: 10.0


satellite:
  # Mass, kg
  # --Entry mass of the Apollo 10 command module. The value is not in the references
  #   collected for this case; 5500 kg is the figure commonly quoted for a lunar-return
  #   CM at entry. The sensitivity to it is reported in README.md.
  mass: 5500.0
  # Characteristic area, m^2
  # --pi/4 x 3.9116^2, the maximum diameter of 154 in. (NASA TN D-3890)
  characteristic_area: 12.0171
  # Characteristic length, m
  characteristic_length: 3.9116

  # Aerodynamic model
  # --constant, or fileread
  kind_aerodynamic_model: constant

  # Drag coefficient (aerodynamic_model: constant)
  # --Trim value at M > 29.5 from NASA TN D-6725 table I, the report this case is
  #   built from. Figure 14 of the same report shows the L/D measured in flight
  #   agreeing with the preflight 0.30 to within the predicted 0.03.
  drag_coefficient: 1.2891

  # Lift coefficient and bank angle (3-DOF)
  # --CL = 0.38773 is the trim value on the same line of table I (L/D = 0.30076).
  # --**The bank angle is the roll angle measured in flight** (figure 12 of the same
  #   report, digitised by digitize_figure.py; see reference/apollo10_roll.dat).
  #   0 deg. is lift up, 180 deg. is lift down; the table is read by linear
  #   interpolation in the time from the entry interface and clamped outside it.
  lift_coefficient: 0.38773

  # Bank angle [deg.] against the time from the entry interface [s], from figure 12.
  # Written by digitize_figure.py (5 s steps); reference/apollo10_roll.dat holds the
  # digitised trace itself.
  bank_angle_table:
    - [   0.0,     1.28]
    - [   5.0,     1.28]
    - [  10.0,     1.34]
    - [  15.0,     1.56]
    - [  20.0,     1.31]
