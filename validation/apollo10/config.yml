  # Not used with kind_aerodynamic_model: constant
  directory_path_specify: manual # default or manual
  directory_aerodynamic: database/aerodynamic
  filename_aerodynamic: aerodynamic.txt

initial_settings:
  # Initial conditions at the entry interface (NASA TN D-6725, table II)
  # --The table gives the INERTIAL speed, flight-path angle and azimuth; Tacode wants
  #   the ECEF velocity in the geocentric local horizon. entry_state.py does the
  #   conversion and prints exactly the block below.
  # Initial coordinate, 1:Long.(deg) 2: Lat.(deg), 3:Alt.(km)
  coordinate:
    - 174.2440
    - -23.6520
    - 123.8833
  # [East, North, Up] in the local geocentric horizon, m/s
  velocity:
    - 10016.49
    - 3413.34
    - -1266.84
  density_factor:
    - 1.0


planet:
  # Gravitational constant, M.m2/kg2
  gravitational_constant: 6.67408e-11
  # Planet mass (Earth), kg
  mass: 5.9723662e+24
  # Planet radius on Equator, m
  radius: 6.3781370e+6
  # Ellipticity
  ellipticity: 3.35281066474e-3
  # Rotation rate, rad/s
  rotation_rate: 7.292115e-5
  # Dynamic form factor (J2) for potential calculation
  potential_factor:
    J2: 1.082629e-3
    J22: -1.81222e-6
    J3: -2.5356e-6
    J4: -1.62336e-6
    Lambda22: -14.545   # Degree


epoch:
  # Absolute time of the initial condition (UTC)
  # --The entry interface is at 191:48:52.16 ground elapsed time, and lift-off was
  #   1969-05-18 16:49:00 UTC. Nothing in this case depends on the epoch (the wind
  #   is off); it records when the state vector applies and ties the case to the
  #   atmosphere table, which was generated for it.
  flag_epoch: True
  datetime: '1969-05-26T16:37:52Z'


atmosphere:
  # Atmosphere model
  # --constant, or fileread
  kind_atmosphere_model: fileread

  # Atmosphere model: constant settings
  # Densitry, kg/m3
  density: 1.e-3
  # Temperature, K
  temperature: 300.0

  # Atmosphere model: file input
  # --NRLMSISE-00 at the entry point and the entry time, generated by
  #   database/atmosphere/generate_atmosphere_table.py. F10.7 = F10.7A = 150,
  #   Ap = 4 (the indices of the day were not available offline).
  directory_path_specify: manual # default or manual
  directory_atmosphere: database/atmosphere
  filename_atmosphere: atmospheremodel_apollo10.txt


wind:
  # No wind: the atmosphere co-rotates with the Earth, as table I assumes when it
  # reports a "relative velocity".
  flag_wind: False
  kind_wind_model: constant
  velocity:
    - 10016.49
    - 3413.34
    - -1266.84
  velocity_factor:
    - 1.0


time_integration:
  # Time marching scheme
  # --"runge_kutta", "explicit_euler"
  kind_time_scheme: runge_kutta

  # Constant timestep, s
  # --The deceleration peaks at 6.8 g; 0.05 s resolves it with room to spare
  #   (the step study is in README.md).
  timestep_constant: 0.05


restart_process:
  # Output directory
  directory_output: output_restart

  # Time series
  # --True: stored individually as time series, False: stored by overwriting
  flag_time_series: False

  # Digid for step
  digid_step: 4

  # Restart step for reading
  restart_step: 500

  # Restart file name (output)
  file_restart: restart.dat

  # Output frequency
  frequency_output: 1


post_process:
  # Output directory
  directory_output: output_result

  # Output (KML)
  kml:
    flag_output: True
    filename_output: geodetic.kml
    linestyle_color: simplekml.Color.white
    linestyle_width: 4
    extrude: 1
    frequency_output: 200

  # Output (Tecplot)
  tecplot:
    flag_output: True
    filename_output: tecplot.dat
    # --One line per second of flight
    frequency_output: 20
